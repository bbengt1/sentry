[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "sentry-ai"
version = "0.1.0"
description = "Camera-only perception for maker robotics"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Sentry AI Contributors" }]
keywords = ["robotics", "perception", "depth", "computer-vision", "makers"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "pyyaml>=6.0.3",
  "typer>=0.27",
  "opencv-python-headless>=4.10,<6",
  "numpy>=2.0,<2.5",
  "fastapi>=0.141,<1",
  "uvicorn[standard]>=0.52,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
  "httpx>=0.28",
]
# Fixed-class detection (Phase 3). Headless OpenCV variant avoids GUI conflict
# with core opencv-python-headless. Install: uv sync --extra dev --extra detect
detect = [
  "ultralytics-opencv-headless>=8.4.33,<9",
]

[project.scripts]
sentry = "sentry_ai.cli:main"

[project.entry-points."sentry_ai.sources"]
synthetic = "sentry_ai.plugins.builtins:SyntheticSource"
usb = "sentry_ai.sources.opencv_source:UsbSource"
file = "sentry_ai.sources.opencv_source:FileSource"
rtsp = "sentry_ai.sources.opencv_source:RtspSource"

[project.entry-points."sentry_ai.workers"]
noop = "sentry_ai.plugins.builtins:NoopWorker"
yolo-fixed = "sentry_ai.models.detection.yolo_worker:YoloDetectionWorker"

[project.entry-points."sentry_ai.sinks"]
null = "sentry_ai.plugins.builtins:NullSink"

[tool.hatch.build.targets.wheel]
packages = ["src/sentry_ai"]

# Include non-Python package data (runtime profiles + Live Preview HTML) in wheels.
[tool.hatch.build.targets.wheel.force-include]
"src/sentry_ai/config/profiles" = "sentry_ai/config/profiles"
"src/sentry_ai/ui/static" = "sentry_ai/ui/static"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

