[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "sentry-ai"
version = "0.1.0"
description = "Camera-only perception for maker robotics"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Sentry AI Contributors" }]
keywords = ["robotics", "perception", "depth", "computer-vision", "makers"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "pyyaml>=6.0.3",
  "typer>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[project.scripts]
sentry = "sentry_ai.cli:main"

[project.entry-points."sentry_ai.sources"]
synthetic = "sentry_ai.plugins.builtins:SyntheticSource"

[project.entry-points."sentry_ai.workers"]
noop = "sentry_ai.plugins.builtins:NoopWorker"

[project.entry-points."sentry_ai.sinks"]
null = "sentry_ai.plugins.builtins:NullSink"

[tool.hatch.build.targets.wheel]
packages = ["src/sentry_ai"]

# Include non-Python package data (runtime profile YAMLs) in wheels.
[tool.hatch.build.targets.wheel.force-include]
"src/sentry_ai/config/profiles" = "sentry_ai/config/profiles"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
