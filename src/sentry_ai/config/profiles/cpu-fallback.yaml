# Built-in runtime profile: CPU-only fallback (FOUND-06 / EDGE-02 / ORT-01)
# preferred_backend=onnxruntime selects live ORT when an allowlisted .onnx
# artifact resolves and onnxruntime is installed (onnx extra); otherwise soft
# torch fallback with reason (ort_artifact_missing / ort_dep_missing / path_rejected).
# Open-vocab weights derive from detector_tier (n → yoloe-26n-seg.pt); mode off by default.
profile: cpu-fallback
device:
  preferred_backend: onnxruntime  # live ORT when .onnx + dep; else soft torch (device=cpu)
  device_id: "cpu"
models:
  allow_cloud: false  # MODEL-01
  defaults_commercially_friendly: true
  detector_tier: n  # → yolo26n.pt + yoloe-26n-seg.pt
  depth_tier: small  # commercially-friendly Small only (never Base/Large NC)
source:
  type: synthetic
